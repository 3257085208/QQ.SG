<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ.SG | Digital Nexus</title>
    <style>
        body { margin: 0; background: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        
        /* 扫描线效果 */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* 浮动UI层 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px; box-sizing: border-box; z-index: 5; pointer-events: none;
        }

        .header { font-size: 1.5rem; letter-spacing: 5px; text-shadow: 0 0 10px #00ff41; }
        
        .nav { pointer-events: auto; }
        .nav-item { 
            display: block; margin: 15px 0; color: #00ff41; text-decoration: none; 
            border: 1px solid #00ff41; padding: 10px 20px; width: fit-content;
            transition: all 0.3s; cursor: pointer; background: rgba(0, 255, 65, 0.1);
        }
        .nav-item:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; transform: translateX(10px); }

        .footer { font-size: 0.8rem; opacity: 0.6; max-width: 400px; line-height: 1.5; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 故障动画 */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .glitch:hover { animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="header glitch">QQ.SG // NKX_CORE</div>
        
        <div class="nav">
            <a href="https://github.com" class="nav-item">> GITHUB_REPOS</a>
            <a href="https://blog.xxx" class="nav-item">> BLOG.NET_LOGS</a>
            <a href="mailto:me@qq.sg" class="nav-item">> SEND_MAIL</a>
        </div>

        <div class="footer">
            [DISCLAIMER]: This node is an independent digital entity. <br>
            NO CONNECTION WITH TENCENT HOLDINGS LTD. <br>
            STATUS: ACTIVE | ENCRYPTION: ENABLED
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, crystal;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 创建核心几何体 (八面体)
            const geometry = new THREE.OctahedronGeometry(2, 0);
            const material = new THREE.MeshPhongMaterial({
                color: 0x00ff41,
                wireframe: true,
                emissive: 0x00ff41,
                emissiveIntensity: 0.5
            });
            crystal = new THREE.Mesh(geometry, material);
            scene.add(crystal);

            // 添加外围粒子云
            const particlesGeometry = new THREE.BufferGeometry();
            const posArray = [];
            for(let i=0; i<5000; i++) {
                posArray.push((Math.random()-0.5)*10);
                posArray.push((Math.random()-0.5)*10);
                posArray.push((Math.random()-0.5)*10);
            }
            particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0x00ff41 });
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // 灯光
            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x111111));

            camera.position.z = 5;
        }

        // 鼠标交互
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);

            // 几何体自转与跟随鼠标旋转
            crystal.rotation.y += 0.01;
            crystal.rotation.x += 0.005;
            
            scene.rotation.y += (mouseX * 0.5 - scene.rotation.y) * 0.05;
            scene.rotation.x += (mouseY * 0.5 - scene.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
        animate();
    </script>
</body>
</html>

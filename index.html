<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F0F0F; /* 深色背景，不像红色那么俗 */
            --accent: #fff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            /* 这里依然可以用你喜欢的背景图，或者保持纯色 */
            background-image: radial-gradient(circle at 50% 30%, #2b1055 0%, #0F0F0F 70%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 关键：把内容撑开，像t.tt那样 */
            color: white;
        }

        /* 1. 顶部巨大文字 (模仿“交个朋友”) */
        .big-title-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1;
            padding-top: 40px;
        }

        .big-text {
            font-size: 18vw; /* 巨大字体 */
            font-weight: 900;
            line-height: 0.8;
            text-transform: uppercase;
            color: rgba(255,255,255,0.05); /* 淡淡的背景字 */
            position: absolute;
            top: 5%;
            z-index: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        .main-hero {
            z-index: 2;
            text-align: center;
            margin-top: 20px;
        }

        /* 头像放大 */
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin: 0 auto;
        }

        .slogan {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 20px;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .sub-slogan {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            margin-top: 5px;
        }

        /* 2. 底部导航栏 (模仿 t.tt 的底部菜单) */
        .bottom-dock {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom)); /* 适配 iPhone 底部横条 */
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 三等分 */
            gap: 10px;
            z-index: 10;
        }

        .dock-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 0;
            text-decoration: none;
            color: white;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .dock-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.1);
        }

        .dock-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 5px;
            fill: white;
        }

        .dock-text {
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0.8;
        }

        /* 复制提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 装饰性背景字，模仿 t.tt 的大字排版 */
        .bg-text-top { top: 5%; left: -10%; }
        .bg-text-bottom { bottom: 20%; right: -10%; font-size: 12vw; opacity: 0.03; }

    </style>
</head>
<body>

    <div class="big-text bg-text-top">NKX DEV</div>
    
    <div class="big-title-container">
        <div class="main-hero">
            <div class="avatar"></div>
            <div class="slogan">Make Friends with Code</div>
            <div class="sub-slogan">Digital Playground @ SG</div>
        </div>
    </div>

    <div class="bottom-dock">
        
        <div class="dock-btn" onclick="copyEmail()">
            <svg class="dock-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span class="dock-text">Email</span>
        </div>

        <a href="https://github.com/3257085208" target="_blank" class="dock-btn">
            <svg class="dock-icon" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            <span class="dock-text">GitHub</span>
        </a>

        <div class="dock-btn" style="opacity: 0.5;">
            <svg class="dock-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <span class="dock-text">Website</span>
        </div>

    </div>

    <div class="toast" id="toast">Copied Email!</div>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            });
        }
    </script>
</body>
</html>

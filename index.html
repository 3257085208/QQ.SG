<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKX | 3257085208</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* GitHub Dark Mode 配色 */
            --bg: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --text-legal: #484f58; /* 更暗的颜色，用于免责声明 */
            --accent: #58a6ff; 
            --btn-hover: #21262d;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        /* 个人信息区 */
        .profile-section {
            margin-bottom: 20px;
        }
        
        .avatar-ring {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            padding: 4px;
            background: var(--card-bg);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            /* 自动拉取你的 GitHub 头像 */
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
        }

        .handle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 8px;
            display: inline-block;
            background: rgba(139, 148, 158, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--text-sub);
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }

        /* 邮箱卡片 */
        .email-card {
            flex-direction: column;
            align-items: flex-start;
            cursor: pointer;
            position: relative;
            background: linear-gradient(180deg, #1f242c 0%, #161b22 100%);
        }

        .label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .email-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 500;
        }

        .copy-status {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #2ea043;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* GitHub 卡片 */
        .github-card {
            font-weight: 600;
        }
        
        .icon-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        svg {
            fill: var(--text-main);
        }

        /* 底部区域 */
        footer {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* 装饰用的 git 命令 */
        .git-cmd {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-sub);
            opacity: 0.6;
        }

        /* 免责声明样式 - 核心部分 */
        .legal-disclaimer {
            font-size: 0.7rem; /* 字号要小 */
            color: var(--text-legal); /* 颜色要暗，不抢视觉 */
            line-height: 1.5;
            max-width: 90%;
            border-top: 1px solid var(--card-border);
            padding-top: 15px;
        }
        
        .contributions {
            display: flex;
            gap: 3px;
            justify-content: center;
            opacity: 0.3;
        }
        .block { width: 10px; height: 10px; background: #21262d; border-radius: 2px; }
        .active { background: #238636; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="profile-section">
            <div class="avatar-ring">
                <div class="avatar"></div>
            </div>
            <h1>NKX</h1>
            <span class="handle">@3257085208</span>
        </div>

        <div class="card email-card" onclick="copyEmail()">
            <span class="label">Email</span>
            <span class="email-text">ME@QQ.SG</span>
            <span class="copy-status" id="copyHint">Copied!</span>
        </div>

        <a href="https://github.com/3257085208" target="_blank" class="card github-card">
            <div class="icon-box">
                <svg height="24" width="24" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                <span>GitHub Profile</span>
            </div>
            <span>↗</span>
        </a>

        <div class="contributions">
            <div class="block"></div><div class="block active"></div><div class="block"></div>
            <div class="block active"></div><div class="block active"></div>
        </div>

        <footer>
            <div class="git-cmd">git push --force origin master</div>
            
            <div class="legal-disclaimer">
                <strong>Disclaimer:</strong> This is a personal portfolio. <br>
                Not affiliated with, endorsed by, or connected to Tencent Holdings Ltd.<br>
                © 2026 NKX. All rights reserved.
            </div>
        </footer>

    </div>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const hint = document.getElementById('copyHint');
                hint.style.opacity = '1';
                setTimeout(() => {
                    hint.style.opacity = '0';
                }, 2000);
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 极简配色系统 */
            --bg: #FAFAFA;       /* 护眼灰白底 */
            --card-bg: #FFFFFF;  /* 纯白卡片 */
            --text-main: #111111;
            --text-sub: #666666;
            --border: #E5E5E5;   /* 极细边框 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* --- 核心修复：解决滚动条问题 --- */
            height: 100dvh;        /* 动态视口高度，自动扣除 Safari 地址栏 */
            overflow: hidden;      /* 强制禁止滚动 */
            display: flex;         /* 垂直居中布局 */
            align-items: center;
            justify-content: center;
            overscroll-behavior: none; /* 禁止橡皮筋回弹 */
        }

        .container {
            width: 100%;
            max-width: 380px;      /* 限制宽度，防止在大屏上太宽 */
            padding: 24px;
            box-sizing: border-box;
        }

        /* 头部区域：左对齐 */
        .header {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column; 
            gap: 16px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 12px;   /* 稍大一点的圆角，更有现代感 */
            /* 自动抓取你的 GitHub 头像 */
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
            background-position: center;
            background-color: #eee;
            border: 1px solid var(--border);
        }

        .identity h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .identity p {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
            line-height: 1.5;
        }

        /* 列表区域 */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none; /* 防止长按选中文字影响体验 */
            -webkit-tap-highlight-color: transparent; /* 去除移动端点击高亮 */
        }

        /* 悬停/点击效果：仅边框变黑 */
        .card:active, .card:hover {
            border-color: #000;
        }

        /* 邮箱卡片稍微大一点 */
        .card.featured {
            padding: 22px 20px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
            font-family: 'Inter', monospace;
        }

        .arrow {
            color: #ddd;
            font-size: 18px;
            transition: color 0.2s;
        }
        
        .card:hover .arrow {
            color: #000;
        }

        /* 复制成功的提示条 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 底部版权 */
        footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #bbb;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="avatar"></div>
            <div class="identity">
                <h1>NKX</h1>
                <p>Digital Playground<br>based in Singapore.</p>
            </div>
        </div>

        <div class="grid">
            
            <div class="card featured" onclick="copyEmail()">
                <div class="card-content">
                    <span class="label">Primary Email</span>
                    <span class="value">ME@QQ.SG</span>
                </div>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5;">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </div>

            <a href="https://github.com/3257085208" target="_blank" class="card">
                <div class="card-content">
                    <span class="label">Code</span>
                    <span class="value">GitHub Profile</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <div class="card" style="opacity: 0.5; cursor: default;">
                <div class="card-content">
                    <span class="label">Project</span>
                    <span class="value">Website Coming Soon</span>
                </div>
            </div>

        </div>

        <footer>
            <span>© 2026 NKX</span>
            <span>QQ.SG</span>
        </footer>

    </div>

    <div class="toast" id="toast">Copied to clipboard</div>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }
    </script>
</body>
</html>

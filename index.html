<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <style>
        :root {
            /* === 浅色模式 === */
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-sub: #666666;
            --text-legal: #999999;
            --border: #E5E5E5;
            --clock-line: #E0E0E0;
            --clock-text: #B0B0B0;
            --pointer: #555555; 
            --toast-bg: rgba(0,0,0,0.9);
            --toast-text: #FFFFFF;
        }

        /* === 深色模式 === */
        [data-theme="dark"] {
            --bg: #000000;
            --card-bg: #111111;
            --text-main: #FFFFFF;
            --text-sub: #888888;
            --text-legal: #555555;
            --border: #222222;
            --clock-line: #444444; 
            --clock-text: #DDDDDD; 
            --pointer: #FFFFFF;
            --toast-bg: rgba(255,255,255,0.9);
            --toast-text: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            overscroll-behavior: none;
            transition: background-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* === 顶部按钮 (固定右上角) === */
        .theme-toggle {
            position: fixed; top: 30px; right: 30px;
            width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.01);
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-main);
            transition: all 0.2s; z-index: 999;
        }
        .theme-toggle:active { transform: scale(0.92); background: var(--card-bg); }
        .theme-toggle svg { width: 20px; height: 20px; stroke-width: 2; }

        /* === 巨型时钟 (完美定位) === */
        .giant-clock-wrapper {
            position: fixed; bottom: 0; right: 0; z-index: 0; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.2, 0, 0, 1);
            /* 手机端: 淡化, 位于右下角 */
            width: 90vh; height: 90vh; transform: translate(40%, 40%); opacity: 0.2;
        }
        @media (min-width: 1024px) {
            .giant-clock-wrapper {
                /* 电脑端: 放大, 加亮, 位于右下角 */
                width: 150vh; height: 150vh; transform: translate(45%, 45%); opacity: 0.6; 
            }
        }
        .clock-svg { width: 100%; height: 100%; overflow: visible; }
        .dial-ring { transform-origin: 50% 50%; transition: transform 1s cubic-bezier(0.2, 0, 0, 1); }
        .seconds-ring { transition: transform 0.2s cubic-bezier(0.4, 2.5, 0.6, 0.5); }

        /* 激光指针 */
        .laser-pointer-line {
            position: absolute; top: 50%; left: 50%; width: 53%; height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--pointer) 20%, var(--pointer) 100%);
            opacity: 0.8; z-index: 1; transform-origin: left center;
            transform: rotate(-135deg); /* 指向左上角 */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .laser-pointer-line::after {
            content: 'UTC+8'; position: absolute; right: 0; bottom: 8px;
            font-size: 11px; font-weight: 700; color: var(--pointer);
            font-family: 'JetBrains Mono', monospace;
            opacity: 1; transform: rotate(180deg);
        }

        /* === 内容容器 === */
        .container {
            width: 100%; max-width: 400px; padding: 24px;
            box-sizing: border-box; display: flex; flex-direction: column;
            justify-content: center; min-height: 100%; position: relative; z-index: 10;
        }
        @media (min-width: 1024px) {
            .container {
                position: absolute; left: 10vw; top: 50%;
                transform: translateY(-50%); max-width: 600px; padding: 0;
            }
        }

        /* 头部 */
        .header {
            margin-bottom: 40px; display: flex; flex-direction: column; gap: 20px;
            text-align: center; width: 100%;
        }
        @media (min-width: 1024px) {
            .header { flex-direction: row; align-items: center; text-align: left; gap: 24px; margin-bottom: 50px; }
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 20px;
            background-image: url('https://github.com/3257085208.png');
            background-size: cover; background-position: center;
            background-color: var(--card-bg); border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 0 auto;
        }
        @media (min-width: 1024px) { .avatar { margin: 0; width: 100px; height: 100px; border-radius: 24px; } }
        .identity h1 { font-size: 32px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px; }
        .identity p { font-size: 16px; color: var(--text-sub); margin: 0; line-height: 1.5; }
        @media (min-width: 1024px) { .identity h1 { font-size: 48px; letter-spacing: -1px; } .identity p { font-size: 18px; } }

        /* 卡片 */
        .grid { display: flex; flex-direction: column; gap: 14px; width: 100%; }
        @media (min-width: 1024px) { .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } }
        .card {
            background: rgba(255, 255, 255, 0.65); border: 1px solid var(--border);
            border-radius: 18px; padding: 20px 24px; text-decoration: none;
            color: var(--text-main); transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; backdrop-filter: blur(20px);
        }
        [data-theme="dark"] .card { background: rgba(20, 20, 20, 0.65); }
        .card:hover { border-color: var(--text-main); background: var(--card-bg); transform: translateY(-2px); }
        .card:active { transform: scale(0.98); }
        .card.featured { padding: 24px 24px; }
        @media (min-width: 1024px) { .card.featured { grid-column: span 2; padding: 32px; } .card.featured .value { font-size: 24px; } }
        
        .card-content { display: flex; flex-direction: column; gap: 4px; }
        .label { font-size: 11px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 17px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

        /* 图标 (加粗修正) */
        .icon-box { color: var(--icon-normal); transition: color 0.2s; }
        .card:hover .icon-box { color: var(--icon-active); }
        .icon-box.success { color: var(--success) !important; transform: scale(1.1); }
        .icon-box svg { stroke-width: 2.5; }

        /* 底部 */
        footer { margin-top: 60px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
        @media (min-width: 1024px) { footer { align-items: flex-start; text-align: left; margin-top: 40px; } }
        
        .copyright-row { font-size: 12px; color: var(--text-sub); opacity: 0.8; }
        .disclaimer { font-size: 10px; color: var(--text-legal); opacity: 0.6; line-height: 1.4; max-width: 300px; }

        /* === 访客计数器 ( UV 去重版) === */
        .visitor-counter {
            font-size: 10px; color: var(--text-legal); opacity: 0.6; margin-top: 2px;
            font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 6px;
        }
        
        /* 原始 Busuanzi 容器必须存在但隐藏，脚本会自动往里面填数 */
        #busuanzi_container_site_uv { display: none !important; }
        
        .loading-spinner {
            width: 10px; height: 10px; border: 1.5px solid var(--text-legal);
            border-top-color: transparent; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--toast-bg); backdrop-filter: blur(10px); color: var(--toast-text);
            padding: 10px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
            transition: all 0.4s; z-index: 200;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme"></button>

    <div class="giant-clock-wrapper">
        <div class="laser-pointer-line"></div>
        <svg class="clock-svg" viewBox="0 0 500 500">
            <g class="dial-ring hour-ring" id="hourRing">
                <circle cx="250" cy="250" r="140" fill="none" stroke="var(--border)" stroke-width="1.5" />
            </g>
            <g class="dial-ring minute-ring" id="minuteRing">
                <circle cx="250" cy="250" r="190" fill="none" stroke="var(--border)" stroke-width="1" />
            </g>
            <g class="dial-ring seconds-ring" id="secondRing">
                <circle cx="250" cy="250" r="240" fill="none" stroke="var(--clock-line)" stroke-width="0.5" />
                <path d="M250 5 L250 30" stroke="var(--border)" stroke-width="3" />
                <path d="M250 470 L250 495" stroke="var(--border)" stroke-width="2" />
                <path d="M5 250 L30 250" stroke="var(--border)" stroke-width="2" />
                <path d="M470 250 L495 250" stroke="var(--border)" stroke-width="2" />
            </g>
        </svg>
    </div>

    <div class="container">
        <div class="header">
            <div class="avatar"></div>
            <div class="identity">
                <h1>NKX</h1>
                <p>Digital Playground based in Singapore.</p>
            </div>
        </div>

        <div class="grid">
            <div class="card featured" id="emailCard" onclick="copyEmail()">
                <div class="card-content">
                    <span class="label">Primary Email</span>
                    <span class="value">ME@QQ.SG</span>
                </div>
                <div class="icon-box" id="copyIconBox">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </div>
            </div>

            <a href="https://github.com/3257085208" target="_blank" class="card">
                <div class="card-content">
                    <span class="label">Code</span>
                    <span class="value">GitHub</span>
                </div>
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </div>
            </a>

            <a href="https://聶.net" target="_blank" class="card">
                <div class="card-content">
                    <span class="label">Blog</span>
                    <span class="value">聶.net</span>
                </div>
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                </div>
            </a>
        </div>

        <footer>
            <div class="copyright-row">© 2026 NKX · QQ.SG</div>
            <div class="disclaimer">Disclaimer: QQ.SG has nothing to do with Tencent Group.</div>
            
            <div class="visitor-counter" id="visitorDisplay">
                <div class="loading-spinner"></div> Visitor No. <span id="countVal">...</span>
            </div>
            
            <span id="busuanzi_container_site_uv" style="display:none !important;">
                <span id="busuanzi_value_site_uv"></span>
            </span>
        </footer>
    </div>

    <div class="toast" id="toast">Copied to clipboard</div>

    <script>
        // 时钟逻辑
        const svgNS = "http://www.w3.org/2000/svg";
        function createText(x, y, content, size, color, weight="500") {
            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", x); text.setAttribute("y", y);
            text.setAttribute("font-size", size); text.setAttribute("fill", color);
            text.setAttribute("text-anchor", "middle"); text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("font-family", "JetBrains Mono"); text.setAttribute("font-weight", weight);
            text.textContent = content; return text;
        }
        function createLine(x1, y1, x2, y2, width, color) {
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", x1); line.setAttribute("y1", y1);
            line.setAttribute("x2", x2); line.setAttribute("y2", y2);
            line.setAttribute("stroke", color); line.setAttribute("stroke-width", width);
            return line;
        }

        const hourGroup = document.getElementById('hourRing');
        for(let i=1; i<=12; i++) {
            const angle = (i * 30 - 90) * (Math.PI / 180); const r = 120;
            const x = 250 + r * Math.cos(angle); const y = 250 + r * Math.sin(angle);
            const text = createText(x, y, i, 18, "var(--text-main)", "800");
            text.setAttribute("transform", `rotate(${i*30}, ${x}, ${y})`); hourGroup.appendChild(text);
        }

        const minGroup = document.getElementById('minuteRing');
        for(let i=0; i<60; i++) {
            const angle = (i * 6 - 90) * (Math.PI / 180);
            const r1 = 180; const r2 = i % 5 === 0 ? 160 : 175;
            const x1 = 250 + r1 * Math.cos(angle); const y1 = 250 + r1 * Math.sin(angle);
            const x2 = 250 + r2 * Math.cos(angle); const y2 = 250 + r2 * Math.sin(angle);
            const line = createLine(x1, y1, x2, y2, i % 5 === 0 ? 2 : 1, "var(--clock-line)");
            minGroup.appendChild(line);
            if(i % 5 === 0) {
                const rText = 145;
                const tx = 250 + rText * Math.cos(angle); const ty = 250 + rText * Math.sin(angle);
                const text = createText(tx, ty, i === 0 ? "60" : i, 12, "var(--clock-text)");
                text.setAttribute("transform", `rotate(${i*6}, ${tx}, ${ty})`); minGroup.appendChild(text);
            }
        }

        const secGroup = document.getElementById('secondRing');
        for(let i=0; i<60; i++) {
            const angle = (i * 6 - 90) * (Math.PI / 180);
            const r1 = 240; const r2 = 230;
            const x1 = 250 + r1 * Math.cos(angle); const y1 = 250 + r1 * Math.sin(angle);
            const x2 = 250 + r2 * Math.cos(angle); const y2 = 250 + r2 * Math.sin(angle);
            const line = createLine(x1, y1, x2, y2, 1, "var(--border)");
            secGroup.appendChild(line);
        }

        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const sgTime = new Date(utc + (3600000 * 8));
            const h = sgTime.getHours(); const m = sgTime.getMinutes(); const s = sgTime.getSeconds(); const ms = sgTime.getMilliseconds();
            const OFFSET = -45;
            const secDeg = -1 * ((s + ms/1000) * 6) + OFFSET;
            const minDeg = -1 * ((m + s/60) * 6) + OFFSET;
            const h12 = h % 12 || 12;
            const hourDeg = -1 * ((h12 + m/60) * 30) + OFFSET;
            document.getElementById('secondRing').style.transform = `rotate(${secDeg}deg)`;
            document.getElementById('minuteRing').style.transform = `rotate(${minDeg}deg)`;
            document.getElementById('hourRing').style.transform = `rotate(${hourDeg}deg)`;
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                const iconBox = document.getElementById('copyIconBox');
                const originalIcon = iconBox.innerHTML;
                iconBox.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                iconBox.classList.add('success'); toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); iconBox.classList.remove('success'); iconBox.innerHTML = originalIcon; }, 2000);
            });
        }

        const themeBtn = document.getElementById('themeBtn');
        const html = document.documentElement;
        const icons = {
            light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>`,
            dark:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
            system: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`
        };
        const modes = ['system', 'light', 'dark'];
        function getStoredTheme() { return localStorage.getItem('theme') || 'system'; }
        function setTheme(mode) {
            themeBtn.innerHTML = icons[mode];
            if (mode === 'system') { localStorage.removeItem('theme'); html.removeAttribute('data-theme'); } 
            else { localStorage.setItem('theme', mode); html.setAttribute('data-theme', mode); }
        }
        let currentMode = getStoredTheme(); setTheme(currentMode);
        themeBtn.addEventListener('click', () => {
            currentMode = modes[(modes.indexOf(currentMode) + 1) % modes.length]; setTheme(currentMode);
        });

        // === 监控不蒜子加载并更新 UI ===
        // 注意：本地 file:// 或 localhost 测试时，不蒜子可能失效或每次都增加，这是正常的。
        // 请上传到 Vercel/Github 后测试。
        const checkBusuanzi = setInterval(() => {
            const uvSpan = document.getElementById('busuanzi_value_site_uv');
            if (uvSpan && uvSpan.textContent.length > 0) {
                clearInterval(checkBusuanzi);
                // 抓取数字并显示
                const num = uvSpan.textContent;
                document.getElementById('visitorDisplay').innerHTML = `Visitor No. <span style="font-weight:700">${num}</span>`;
            }
        }, 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-sub: #666666;
            --text-legal: #999999; /* 专门给免责声明用的浅色 */
            --border: #E5E5E5;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100dvh;        /* 完美适配移动端高度 */
            overflow: hidden;      /* 禁止滚动 */
            display: flex;
            align-items: center;
            justify-content: center;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 头部区域 */
        .header {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column; 
            gap: 16px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
            background-position: center;
            background-color: #eee;
            border: 1px solid var(--border);
        }

        .identity h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .identity p {
            font-size: 15px; /* 稍微调大一点，更清晰 */
            color: var(--text-sub);
            margin: 0;
            line-height: 1.4;
        }

        /* 列表区域 */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card:active, .card:hover {
            border-color: #000;
        }

        .card.featured {
            padding: 22px 20px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
            font-family: 'Inter', monospace;
        }

        .arrow {
            color: #ddd;
            font-size: 18px;
            transition: color 0.2s;
        }
        
        .card:hover .arrow {
            color: #000;
        }

        /* 底部版权区域 - 专门优化布局 */
        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column; /* 改为垂直排列，放下长句子 */
            gap: 8px;
        }

        .copyright {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .disclaimer {
            font-size: 11px; /* 字号稍微小一点 */
            color: var(--text-legal); /* 颜色更淡，不喧宾夺主 */
            line-height: 1.4;
        }

        /* 提示条 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            white-space: nowrap;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="avatar"></div>
            <div class="identity">
                <h1>NKX</h1>
                <p>This is the channel of MarkNKX.</p>
            </div>
        </div>

        <div class="grid">
            
            <div class="card featured" onclick="copyEmail()">
                <div class="card-content">
                    <span class="label">Primary Email</span>
                    <span class="value">ME@QQ.SG</span>
                </div>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.5;">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </div>

            <a href="https://github.com/3257085208" target="_blank" class="card">
                <div class="card-content">
                    <span class="label">Code</span>
                    <span class="value">GitHub Profile</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <div class="card" style="opacity: 0.5; cursor: default;">
                <div class="card-content">
                    <span class="label">Project</span>
                    <span class="value">Website Coming Soon</span>
                </div>
            </div>

        </div>

        <footer>
            <div class="copyright">© 2026 NKX</div>
            <div class="disclaimer">QQ.SG has nothing to do with Tencent Group.</div>
        </footer>

    </div>

    <div class="toast" id="toast">Copied to clipboard</div>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }
    </script>
</body>
</html>

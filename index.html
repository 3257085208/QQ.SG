<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Network Globe</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(32, 132, 255, 0.22), transparent 36%),
        radial-gradient(circle at 20% 80%, rgba(0, 180, 255, 0.12), transparent 32%),
        #020817;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    .ui {
      position: fixed;
      left: 36px;
      top: 34px;
      z-index: 10;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.22em;
      color: rgba(150, 210, 255, 0.8);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 760;
      max-width: 620px;
    }

    .desc {
      margin-top: 18px;
      max-width: 430px;
      font-size: 15px;
      line-height: 1.7;
      color: rgba(215, 235, 255, 0.72);
    }

    .panel {
      position: fixed;
      right: 32px;
      bottom: 28px;
      width: min(360px, calc(100vw - 48px));
      padding: 18px 18px 16px;
      border: 1px solid rgba(120, 200, 255, 0.22);
      background: rgba(4, 16, 38, 0.48);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .panel-title {
      font-size: 13px;
      color: rgba(160, 220, 255, 0.88);
      margin-bottom: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .cities {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 14px;
      font-size: 13px;
      color: rgba(235, 248, 255, 0.78);
    }

    .city {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #60c8ff;
      box-shadow: 0 0 16px #3fbaff;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      color: rgba(210, 235, 255, 0.5);
      font-size: 13px;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
    }

    canvas {
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    @media (max-width: 760px) {
      .ui {
        left: 22px;
        top: 26px;
      }

      .desc {
        font-size: 13px;
        max-width: 310px;
      }

      .panel {
        left: 16px;
        right: 16px;
        bottom: 18px;
        width: auto;
        border-radius: 18px;
      }

      .cities {
        grid-template-columns: repeat(2, 1fr);
        font-size: 12px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div class="ui">
    <div class="eyebrow">Global Infrastructure Map</div>
    <h1>Connected<br />Across Regions</h1>
    <div class="desc">
      Hong Kong, Los Angeles, San Jose, Phoenix, Frankfurt, Tokyo, Italy,
      Singapore and Guangzhou are linked through animated network routes.
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Active Regions</div>
    <div class="cities" id="cityList"></div>
  </div>

  <div class="hint">Drag to rotate · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const container = document.getElementById("app");

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 4.7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.rotateSpeed = 0.5;
    controls.zoomSpeed = 0.5;
    controls.minDistance = 3.2;
    controls.maxDistance = 7;
    controls.enablePan = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const R = 1.52;

    const ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambient);

    const light = new THREE.DirectionalLight(0x7ccfff, 2.5);
    light.position.set(4, 3, 5);
    scene.add(light);

    const backLight = new THREE.DirectionalLight(0x1b74ff, 1.6);
    backLight.position.set(-4, -2, -3);
    scene.add(backLight);

    const globeGeometry = new THREE.SphereGeometry(R, 96, 96);

    const globeMaterial = new THREE.MeshPhongMaterial({
      color: 0x061f4a,
      emissive: 0x031633,
      shininess: 36,
      transparent: true,
      opacity: 0.96
    });

    const globe = new THREE.Mesh(globeGeometry, globeMaterial);
    globeGroup.add(globe);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(R * 1.035, 96, 96),
      new THREE.MeshBasicMaterial({
        color: 0x2aa8ff,
        transparent: true,
        opacity: 0.09,
        side: THREE.BackSide
      })
    );
    globeGroup.add(atmosphere);

    const gridMaterial = new THREE.LineBasicMaterial({
      color: 0x1d8fff,
      transparent: true,
      opacity: 0.18
    });

    function makeLatitude(lat) {
      const points = [];
      const phi = THREE.MathUtils.degToRad(90 - lat);
      for (let i = 0; i <= 240; i++) {
        const theta = THREE.MathUtils.degToRad(i / 240 * 360);
        points.push(new THREE.Vector3(
          R * Math.sin(phi) * Math.cos(theta),
          R * Math.cos(phi),
          R * Math.sin(phi) * Math.sin(theta)
        ));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      return new THREE.Line(geo, gridMaterial);
    }

    function makeLongitude(lon) {
      const points = [];
      const theta = THREE.MathUtils.degToRad(lon);
      for (let i = 0; i <= 240; i++) {
        const phi = THREE.MathUtils.degToRad(i / 240 * 180);
        points.push(new THREE.Vector3(
          R * Math.sin(phi) * Math.cos(theta),
          R * Math.cos(phi),
          R * Math.sin(phi) * Math.sin(theta)
        ));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      return new THREE.Line(geo, gridMaterial);
    }

    for (let lat = -60; lat <= 60; lat += 20) {
      globeGroup.add(makeLatitude(lat));
    }

    for (let lon = -180; lon < 180; lon += 30) {
      globeGroup.add(makeLongitude(lon));
    }

    function latLngToVec3(lat, lng, radius = R) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lng + 180);

      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    const cities = [
      { name: "Hong Kong", cn: "香港", lat: 22.3193, lng: 114.1694 },
      { name: "Los Angeles", cn: "洛杉矶", lat: 34.0522, lng: -118.2437 },
      { name: "San Jose", cn: "圣何塞", lat: 37.3382, lng: -121.8863 },
      { name: "Phoenix", cn: "凤凰城", lat: 33.4484, lng: -112.0740 },
      { name: "Frankfurt", cn: "法兰克福", lat: 50.1109, lng: 8.6821 },
      { name: "Tokyo", cn: "东京", lat: 35.6762, lng: 139.6503 },
      { name: "Italy", cn: "意大利", lat: 41.9028, lng: 12.4964 },
      { name: "Singapore", cn: "新加坡", lat: 1.3521, lng: 103.8198 },
      { name: "Guangzhou", cn: "广州", lat: 23.1291, lng: 113.2644 }
    ];

    const cityList = document.getElementById("cityList");

    cities.forEach(city => {
      const item = document.createElement("div");
      item.className = "city";
      item.innerHTML = `<span class="dot"></span><span>${city.cn} / ${city.name}</span>`;
      cityList.appendChild(item);
    });

    const pointGroup = new THREE.Group();
    globeGroup.add(pointGroup);

    const labelGroup = new THREE.Group();
    globeGroup.add(labelGroup);

    function makeCityPoint(city) {
      const position = latLngToVec3(city.lat, city.lng, R * 1.012);

      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.018, 18, 18),
        new THREE.MeshBasicMaterial({
          color: 0x86dcff
        })
      );

      dot.position.copy(position);

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 24, 24),
        new THREE.MeshBasicMaterial({
          color: 0x28aaff,
          transparent: true,
          opacity: 0.28
        })
      );

      halo.position.copy(position);

      pointGroup.add(dot);
      pointGroup.add(halo);

      city.dot = dot;
      city.halo = halo;
      city.position = position;
    }

    cities.forEach(makeCityPoint);

    function createArc(start, end, height = 0.55) {
      const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(R + height);

      const curve = new THREE.QuadraticBezierCurve3(
        start.clone().multiplyScalar(1.015),
        mid,
        end.clone().multiplyScalar(1.015)
      );

      const points = curve.getPoints(96);
      const geo = new THREE.BufferGeometry().setFromPoints(points);

      const mat = new THREE.LineDashedMaterial({
        color: 0x67d7ff,
        transparent: true,
        opacity: 0,
        dashSize: 0.05,
        gapSize: 0.035,
        linewidth: 1
      });

      const line = new THREE.Line(geo, mat);
      line.computeLineDistances();

      line.userData = {
        phase: Math.random() * Math.PI * 2,
        speed: 0.7 + Math.random() * 0.6,
        life: Math.random(),
        targetOpacity: 0.25 + Math.random() * 0.65
      };

      globeGroup.add(line);
      return line;
    }

    const routePairs = [
      ["Hong Kong", "Los Angeles"],
      ["Hong Kong", "San Jose"],
      ["Hong Kong", "Singapore"],
      ["Hong Kong", "Tokyo"],
      ["Guangzhou", "Hong Kong"],
      ["Guangzhou", "Singapore"],
      ["Tokyo", "Los Angeles"],
      ["Tokyo", "San Jose"],
      ["Los Angeles", "Phoenix"],
      ["San Jose", "Phoenix"],
      ["Los Angeles", "Frankfurt"],
      ["Frankfurt", "Italy"],
      ["Frankfurt", "Singapore"],
      ["Singapore", "Tokyo"],
      ["Singapore", "Italy"],
      ["San Jose", "Frankfurt"]
    ];

    const cityMap = Object.fromEntries(cities.map(c => [c.name, c]));
    const routes = [];

    routePairs.forEach(([a, b]) => {
      const start = cityMap[a].position;
      const end = cityMap[b].position;
      routes.push(createArc(start, end, 0.36 + Math.random() * 0.34));
    });

    // 粗略国家轮廓线：使用 Three.js 官方示例用过的 world geojson 数据
    async function loadCountryBorders() {
      try {
        const res = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
        const topology = await res.json();

        const topojson = await import("https://cdn.jsdelivr.net/npm/topojson-client@3/+esm");
        const countries = topojson.feature(topology, topology.objects.countries);

        const borderMat = new THREE.LineBasicMaterial({
          color: 0x78ccff,
          transparent: true,
          opacity: 0.48
        });

        countries.features.forEach(feature => {
          const coords = feature.geometry.coordinates;
          const type = feature.geometry.type;

          const drawPolygon = polygon => {
            polygon.forEach(ring => {
              const points = ring.map(([lng, lat]) => latLngToVec3(lat, lng, R * 1.006));

              if (points.length > 1) {
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, borderMat);
                globeGroup.add(line);
              }
            });
          };

          if (type === "Polygon") {
            drawPolygon(coords);
          }

          if (type === "MultiPolygon") {
            coords.forEach(drawPolygon);
          }
        });
      } catch (err) {
        console.warn("Country border data failed to load:", err);
      }
    }

    loadCountryBorders();

    // 星点背景
    const starGeo = new THREE.BufferGeometry();
    const starCount = 900;
    const starPositions = [];

    for (let i = 0; i < starCount; i++) {
      const x = (Math.random() - 0.5) * 12;
      const y = (Math.random() - 0.5) * 12;
      const z = (Math.random() - 0.5) * 12;
      starPositions.push(x, y, z);
    }

    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));

    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({
        size: 0.008,
        color: 0x9edcff,
        transparent: true,
        opacity: 0.5
      })
    );

    scene.add(stars);

    const clock = new THREE.Clock();

    function animate() {
      const t = clock.getElapsedTime();

      controls.update();

      routes.forEach((route, index) => {
        const pulse = Math.sin(t * route.userData.speed + route.userData.phase);
        const visible = Math.max(0, pulse);
        route.material.opacity = visible * route.userData.targetOpacity;

        route.material.dashOffset = -t * 0.22 - index * 0.02;
      });

      cities.forEach((city, index) => {
        const s = 1 + Math.sin(t * 2.6 + index) * 0.18;
        city.halo.scale.setScalar(s);
        city.halo.material.opacity = 0.18 + Math.max(0, Math.sin(t * 2 + index)) * 0.22;
      });

      stars.rotation.y += 0.00025;
      stars.rotation.x += 0.00008;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>

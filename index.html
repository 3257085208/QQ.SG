<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX | Smart Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 核心变量 */
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-hover: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden; /* 防止滚动，像App一样 */
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 背景图：这里用了一张高质量的 Unsplash 黑色抽象图，你可以换成任何你喜欢的 */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        /* 遮罩层：让背景稍微暗一点，保证文字清晰 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px); /* t.tt 风格的核心：背景模糊 */
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
            padding-bottom: 40px;
        }

        /* 头像区域 */
        .avatar-wrapper {
            margin-bottom: 20px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* 圆形头像 */
            /* 自动抓取 GitHub 头像 */
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin: 10px 0 5px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .bio {
            font-size: 0.95rem;
            color: var(--secondary-text);
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* 按钮组 - t.tt 风格的大块按钮 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between; /* 图标在两端 */
            padding: 18px 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; /* 类似 iOS 的圆角 */
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
            cursor: pointer;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--glass-hover);
            transform: scale(1.02); /* 悬停微放大 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 按钮内部布局 */
        .btn-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .btn-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .btn-arrow {
            opacity: 0.5;
            font-size: 1.2rem;
        }

        /* 特殊样式的邮箱复制提示 */
        .copy-toast {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 204, 113, 0.9); /* 成功时的绿色 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* 底部版权 */
        footer {
            margin-top: 50px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        
        <div class="avatar-wrapper">
            <div class="avatar"></div>
        </div>
        <h1>NKX</h1>
        <p class="bio">Digital Playground @ Singapore</p>

        <div class="links">
            
            <div class="btn" onclick="copyEmail()">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <span class="btn-text">ME@QQ.SG</span>
                </div>
                <div class="btn-arrow">Copy</div>
                <div class="copy-toast" id="toast">Copied to Clipboard!</div>
            </div>

            <a href="https://github.com/3257085208" target="_blank" class="btn">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span class="btn-text">GitHub</span>
                </div>
                <div class="btn-arrow">→</div>
            </a>

            <a href="#" class="btn" style="opacity: 0.6;">
                <div class="btn-content">
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <span class="btn-text">Website</span>
                </div>
                <div class="btn-arrow">Coming Soon</div>
            </a>

        </div>

        <footer>
            Hosted on QQ.SG<br>
            Disclaimer: Personal Profile. Not affiliated with Tencent.
        </footer>
    </div>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* === 浅色模式 === */
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-sub: #666666;
            --text-legal: #CCCCCC;
            --border: #E5E5E5;
            --clock-line: #E5E5E5; /* 调淡一点，防止太抢眼 */
            --clock-text: #B0B0B0;
            --pointer: #FF3B30;
            --toast-bg: rgba(0,0,0,0.8);
            --toast-text: #FFFFFF;
        }

        /* === 深色模式 === */
        [data-theme="dark"] {
            --bg: #000000;
            --card-bg: #111111;
            --text-main: #FFFFFF;
            --text-sub: #888888;
            --text-legal: #444444;
            --border: #222222;
            --clock-line: #1A1A1A;
            --clock-text: #333333;
            --pointer: #FF453A;
            --toast-bg: rgba(255,255,255,0.9);
            --toast-text: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center; /* 内容依然居中 */
            overscroll-behavior: none;
            transition: background-color 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        /* === 核心修改：巨型右置时钟 === */
        .giant-clock-wrapper {
            position: fixed; /* 固定定位，雷打不动 */
            top: 50%;
            /* 核心布局逻辑：
               1. 宽度设为 160vh (屏幕高度的1.6倍)，保证巨大。
               2. right: -60vh; 把圆心往右推，让左半部分露出来。
            */
            width: 160vh;  
            height: 160vh;
            right: -60vh; 
            transform: translateY(-50%); /* 垂直居中 */
            
            z-index: 0;
            pointer-events: none;
            opacity: 0.8; /* 稍微透明一点，增加层次感 */
        }

        /* 移动端特殊调整：手机屏幕窄，往右推多一点 */
        @media (max-width: 768px) {
            .giant-clock-wrapper {
                width: 140vh;
                height: 140vh;
                right: -70vh; /* 手机上只露出一小半，防止文字看不清 */
                opacity: 0.6; /* 手机上淡一点 */
            }
        }

        .clock-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .dial-ring {
            transform-origin: 50% 50%;
            transition: transform 1s cubic-bezier(0.2, 0, 0, 1);
        }
        
        .seconds-ring {
            transition: transform 0.2s cubic-bezier(0.4, 2.5, 0.6, 0.5);
        }

        /* 指针：现在在右边，需要重新定位吗？
           不需要，因为它是相对于 SVG 居中的，SVG 本身右移了，指针自然跟着右移。
           但因为我们只显示左半边，指针（在12点方向）可能看不见。
           我们需要把指针改成“水平指向左边” (9点钟方向) 看起来更酷？
           
           不，保持 12 点方向（向上）是最自然的 UTC 时间显示。
           由于圆心在屏幕右侧边缘附近，12点方向的指针会在屏幕右上角边缘，看起来很合理。
        */
        .static-pointer {
            position: absolute;
            top: 10%; /* 靠近圆周 */
            left: 50%;
            transform: translateX(-50%);
            width: 3px; /* 加粗一点 */
            height: 60px; /* 加长 */
            background: var(--pointer);
            z-index: 1;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.4); /* 给指针加点光晕 */
        }
        
        .static-pointer::after {
            content: 'UTC+8';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 800;
            color: var(--pointer);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 59, 48, 0.3);
        }

        /* === 前景内容 === */
        .container {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%;
            position: relative;
            z-index: 10;
            
            /* 在电脑端，因为右边有时钟，我们把内容稍微往左偏一点，保持平衡 */
            margin-right: 0; 
            transition: margin 0.3s;
        }

        /* 电脑端适配：内容左移，避让大时钟 */
        @media (min-width: 1024px) {
            .container {
                margin-right: 20vw; /* 内容往左挪，把右边留给大时钟 */
                max-width: 440px;
            }
        }

        /* 顶部切换按钮 */
        .theme-toggle {
            position: absolute;
            top: 30px;
            left: 30px; /* 改到左上角！因为右上角被时钟占了 */
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.1); /* 微透明 */
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s;
            z-index: 100;
        }
        
        .theme-toggle svg { width: 20px; height: 20px; stroke-width: 1.8; }

        /* 头部 */
        .header {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column; 
            gap: 16px;
            /* 电脑上左对齐，手机上居中 */
            text-align: center; 
        }
        @media (min-width: 1024px) {
            .header { text-align: left; align-items: flex-start; }
            .avatar { margin: 0; } /* 头像不居中 */
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
            background-position: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin: 0 auto;
        }

        .identity h1 { font-size: 32px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -1px; }
        .identity p { font-size: 16px; color: var(--text-sub); margin: 0; line-height: 1.5; }

        /* 卡片 */
        .grid { display: flex; flex-direction: column; gap: 14px; }

        .card {
            background: rgba(255, 255, 255, 0.6); /* 更透明，透出背景 */
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            backdrop-filter: blur(20px); /* 强毛玻璃 */
        }
        
        [data-theme="dark"] .card { background: rgba(20, 20, 20, 0.6); }

        .card:active { transform: scale(0.98); }
        .card:hover { border-color: var(--text-main); background: var(--card-bg); } /* 悬停变实心 */

        .card.featured { padding: 24px 24px; }
        .card-content { display: flex; flex-direction: column; gap: 4px; }
        .label { font-size: 11px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-size: 17px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

        .icon-box { color: var(--icon-normal); transition: color 0.2s; }
        .card:hover .icon-box { color: var(--icon-active); }
        .icon-box.success { color: var(--success) !important; transform: scale(1.1); }

        /* 底部 */
        footer {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        @media (min-width: 1024px) { footer { align-items: flex-start; } }

        .copyright-row { font-size: 12px; color: var(--text-sub); opacity: 0.8; }
        .disclaimer { font-size: 10px; color: var(--text-legal); opacity: 0.6; }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s;
            z-index: 200;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="giant-clock-wrapper">
        <div class="static-pointer"></div>
        <svg class="clock-svg" viewBox="0 0 500 500">
            <g class="dial-ring hour-ring" id="hourRing">
                <circle cx="250" cy="250" r="140" fill="none" stroke="var(--border)" stroke-width="1.5" />
            </g>
            
            <g class="dial-ring minute-ring" id="minuteRing">
                <circle cx="250" cy="250" r="190" fill="none" stroke="var(--border)" stroke-width="1" />
            </g>

            <g class="dial-ring seconds-ring" id="secondRing">
                <circle cx="250" cy="250" r="240" fill="none" stroke="var(--clock-line)" stroke-width="0.5" />
                <path d="M250 5 L250 30" stroke="var(--text-main)" stroke-width="3" />
                <path d="M250 470 L250 495" stroke="var(--border)" stroke-width="2" />
                <path d="M5 250 L30 250" stroke="var(--border)" stroke-width="2" />
                <path d="M470 250 L495 250" stroke="var(--border)" stroke-width="2" />
            </g>
        </svg>
    </div>

    <div class="container">
        <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme"></button>

        <div class="header">
            <div class="avatar"></div>
            <div class="identity">
                <h1>NKX</h1>
                <p>Digital Playground based in Singapore.</p>
            </div>
        </div>

        <div class="grid">
            <div class="card featured" id="emailCard" onclick="copyEmail()">
                <div class="card-content">
                    <span class="label">Primary Email</span>
                    <span class="value">ME@QQ.SG</span>
                </div>
                <div class="icon-box" id="copyIconBox">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>
            </div>

            <a href="https://github.com/3257085208" target="_blank" class="card">
                <div class="card-content">
                    <span class="label">Code</span>
                    <span class="value">GitHub Profile</span>
                </div>
                <div class="icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <div class="card" style="opacity: 0.5; cursor: default;">
                <div class="card-content">
                    <span class="label">Project</span>
                    <span class="value">Website Coming Soon</span>
                </div>
            </div>
        </div>

        <footer>
            <div class="copyright-row">© 2026 NKX · QQ.SG</div>
            <div class="disclaimer">Disclaimer: QQ.SG has nothing to do with Tencent Group.</div>
        </footer>
    </div>

    <div class="toast" id="toast">Copied to clipboard</div>

    <script>
        // === 1. 构建时钟 (SVG) ===
        const svgNS = "http://www.w3.org/2000/svg";
        
        function createText(x, y, content, size, color, weight="500") {
            const text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", x);
            text.setAttribute("y", y);
            text.setAttribute("font-size", size);
            text.setAttribute("fill", color);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("dominant-baseline", "middle");
            text.setAttribute("font-family", "JetBrains Mono");
            text.setAttribute("font-weight", weight);
            text.textContent = content;
            return text;
        }

        function createLine(x1, y1, x2, y2, width, color) {
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", width);
            return line;
        }

        const hourGroup = document.getElementById('hourRing');
        for(let i=1; i<=12; i++) {
            const angle = (i * 30 - 90) * (Math.PI / 180);
            const r = 120;
            const x = 250 + r * Math.cos(angle);
            const y = 250 + r * Math.sin(angle);
            const text = createText(x, y, i, 18, "var(--text-main)", "800");
            text.setAttribute("transform", `rotate(${i*30}, ${x}, ${y})`);
            hourGroup.appendChild(text);
        }

        const minGroup = document.getElementById('minuteRing');
        for(let i=0; i<60; i++) {
            const angle = (i * 6 - 90) * (Math.PI / 180);
            const r1 = 180;
            const r2 = i % 5 === 0 ? 160 : 175;
            const x1 = 250 + r1 * Math.cos(angle);
            const y1 = 250 + r1 * Math.sin(angle);
            const x2 = 250 + r2 * Math.cos(angle);
            const y2 = 250 + r2 * Math.sin(angle);
            const line = createLine(x1, y1, x2, y2, i % 5 === 0 ? 2 : 1, "var(--clock-line)");
            minGroup.appendChild(line);
            
            if(i % 5 === 0) {
                const rText = 145;
                const tx = 250 + rText * Math.cos(angle);
                const ty = 250 + rText * Math.sin(angle);
                const text = createText(tx, ty, i === 0 ? "60" : i, 12, "var(--clock-text)");
                text.setAttribute("transform", `rotate(${i*6}, ${tx}, ${ty})`);
                minGroup.appendChild(text);
            }
        }

        const secGroup = document.getElementById('secondRing');
        for(let i=0; i<60; i++) {
            const angle = (i * 6 - 90) * (Math.PI / 180);
            const r1 = 240;
            const r2 = 230;
            const x1 = 250 + r1 * Math.cos(angle);
            const y1 = 250 + r1 * Math.sin(angle);
            const x2 = 250 + r2 * Math.cos(angle);
            const y2 = 250 + r2 * Math.sin(angle);
            const line = createLine(x1, y1, x2, y2, 1, "var(--border)");
            secGroup.appendChild(line);
        }

        // === 2. 逻辑 ===
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const sgTime = new Date(utc + (3600000 * 8)); // 锁定 UTC+8

            const h = sgTime.getHours();
            const m = sgTime.getMinutes();
            const s = sgTime.getSeconds();
            const ms = sgTime.getMilliseconds();
            
            const secDeg = -1 * ((s + ms/1000) * 6);
            const minDeg = -1 * ((m + s/60) * 6);
            const h12 = h % 12 || 12;
            const hourDeg = -1 * ((h12 + m/60) * 30);

            document.getElementById('secondRing').style.transform = `rotate(${secDeg}deg)`;
            document.getElementById('minuteRing').style.transform = `rotate(${minDeg}deg)`;
            document.getElementById('hourRing').style.transform = `rotate(${hourDeg}deg)`;
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        // === 3. 功能 ===
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                const iconBox = document.getElementById('copyIconBox');
                const originalIcon = iconBox.innerHTML;
                iconBox.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                iconBox.classList.add('success'); 
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                    iconBox.classList.remove('success'); 
                    iconBox.innerHTML = originalIcon;
                }, 2000);
            });
        }

        const themeBtn = document.getElementById('themeBtn');
        const html = document.documentElement;
        const icons = {
            light: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>`,
            dark:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
            system: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`
        };
        const modes = ['system', 'light', 'dark'];
        function getStoredTheme() { return localStorage.getItem('theme') || 'system'; }
        function setTheme(mode) {
            themeBtn.innerHTML = icons[mode];
            if (mode === 'system') {
                localStorage.removeItem('theme');
                html.removeAttribute('data-theme');
            } else {
                localStorage.setItem('theme', mode);
                html.setAttribute('data-theme', mode);
            }
        }
        let currentMode = getStoredTheme();
        setTheme(currentMode);
        themeBtn.addEventListener('click', () => {
            const nextIndex = (modes.indexOf(currentMode) + 1) % modes.length;
            currentMode = modes[nextIndex];
            setTheme(currentMode);
        });
    </script>
</body>
</html>

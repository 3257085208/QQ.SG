<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ.SG — Refined Console</title>
  <style>
    :root {
      --bg: #f3f3f0;
      --bg-2: #efefeb;
      --card: rgba(255,255,255,.34);
      --line: rgba(16,16,16,.062);
      --line-strong: rgba(16,16,16,.14);
      --text: #131316;
      --muted: #70706d;
      --soft: #a5a5a0;
      --radius: 28px;
      --shadow: 0 12px 30px rgba(0,0,0,.028);
      --ease: cubic-bezier(.22,.88,.28,1);
      --avatar-size: 88px;
      --panel-w: min(430px, calc(100vw - 40px));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,.72), transparent 26%),
        radial-gradient(circle at 84% 88%, rgba(255,255,255,.4), transparent 22%);
      opacity: .95;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: clamp(26px, 4vw, 42px);
      display: grid;
      grid-template-columns: minmax(360px, 500px) 1fr;
      gap: clamp(20px, 3vw, 56px);
      align-items: center;
      isolation: isolate;
    }

    .left {
      position: relative;
      z-index: 3;
      width: var(--panel-w);
      margin-left: clamp(0px, 5vw, 120px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(-2vh);
    }

    .hero {
      display: grid;
      grid-template-columns: var(--avatar-size) 1fr;
      gap: 20px;
      align-items: center;
      margin-bottom: 18px;
    }

    .avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.86), rgba(255,255,255,.18) 42%, rgba(255,255,255,0) 62%),
        linear-gradient(145deg, #f6f6f2, #e6e6e0);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      user-select: none;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar span {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .08em;
      color: rgba(18,18,20,.72);
    }

    .title {
      margin: 0;
      font-size: clamp(54px, 6vw, 82px);
      line-height: .92;
      font-weight: 800;
      letter-spacing: -.075em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.5vw, 18px);
      line-height: 1.45;
      letter-spacing: -.01em;
    }

    .card {
      position: relative;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      transition: border-color .25s ease, transform .32s var(--ease), background .25s ease;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(16,16,16,.1);
      background: rgba(255,255,255,.44);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0));
      opacity: .7;
    }

    .primary {
      padding: 26px 26px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      min-height: 132px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--soft);
    }

    .primary-value {
      margin: 0;
      font-size: clamp(34px, 3vw, 42px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -.055em;
    }

    .primary-meta {
      margin: 8px 0 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 15px;
    }

    .primary-meta span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .primary-meta span::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(16,16,16,.16);
    }

    .copy {
      position: relative;
      z-index: 1;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.34);
      display: grid;
      place-items: center;
      color: var(--text);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      flex: 0 0 auto;
    }

    .copy:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.6);
      border-color: rgba(16,16,16,.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .link-card {
      text-decoration: none;
      color: inherit;
      min-height: 86px;
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .link-value {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .link-icon {
      position: relative;
      z-index: 1;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.28);
      display: grid;
      place-items: center;
      color: rgba(18,18,20,.9);
      flex: 0 0 auto;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .link-card:hover .link-icon {
      transform: translateX(1px);
      background: rgba(255,255,255,.52);
      border-color: rgba(16,16,16,.12);
    }

    .footer {
      margin-top: 8px;
      color: var(--soft);
      font-size: 13px;
      line-height: 1.5;
      max-width: 380px;
    }

    .footer .copyright {
      color: rgba(16,16,16,.5);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .right {
      position: relative;
      min-width: 0;
      min-height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    .dial-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .dial {
      position: absolute;
      width: min(78vw, 1120px);
      height: min(78vw, 1120px);
      right: clamp(-260px, -10vw, -120px);
      top: 50%;
      transform: translateY(-50%);
      opacity: .96;
      transition: transform 800ms var(--ease);
    }

    .dial svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }


    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(16px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(17,17,20,.92);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
      z-index: 20;
      letter-spacing: .02em;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1040px) {
      body { overflow: auto; }
      .page {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .left {
        width: min(100%, 480px);
        margin-left: 0;
        transform: none;
      }
      .right {
        min-height: 54vh;
      }
      .dial {
        right: -140px;
        top: 58%;
        width: min(98vw, 900px);
        height: min(98vw, 900px);
      }
    }

    @media (max-width: 640px) {
      .page { padding: 18px; }
      .hero {
        grid-template-columns: 74px 1fr;
        gap: 16px;
        margin-bottom: 10px;
      }
      :root { --avatar-size: 74px; }
      .title { font-size: 50px; }
      .primary { padding: 22px 20px 20px; min-height: 122px; }
      .primary-value { font-size: 30px; }
      .row { grid-template-columns: 1fr; }
      .dial {
        width: 150vw;
        height: 150vw;
        right: -45vw;
        top: 60%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="left">
      <div class="hero">
        <div class="avatar" id="avatar"></div>
        <div>
          <h1 class="title" id="name">NKX</h1>
          <p class="subtitle" id="tagline">This is the channel of MarkNKX.</p>
        </div>
      </div>

      <article class="card primary">
        <div>
          <p class="eyebrow" id="primaryLabel">Primary Email</p>
          <p class="primary-value" id="primaryValue">ME@qq.sg</p>
          <div class="primary-meta" id="meta"></div>
        </div>
        <button class="copy" id="copyBtn" aria-label="复制邮箱">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15V6a2 2 0 0 1 2-2h9"></path>
          </svg>
        </button>
      </article>

      <div class="row">
        <a class="card link-card" id="githubCard" href="#" target="_blank" rel="noreferrer">
          <div>
            <p class="eyebrow" id="githubLabel">Code</p>
            <p class="link-value" id="githubValue">GitHub</p>
          </div>
          <span class="link-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="M12 5l7 7-7 7"></path>
            </svg>
          </span>
        </a>

        <a class="card link-card" id="blogCard" href="#" target="_blank" rel="noreferrer">
          <div>
            <p class="eyebrow" id="blogLabel">Blog</p>
            <p class="link-value" id="blogValue">碑.NET</p>
          </div>
          <span class="link-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h10"></path>
            </svg>
          </span>
        </a>
      </div>

      <footer class="footer">
        <div class="copyright" id="copyright">© 2026 NKX · QQ.SG</div>
        <div id="footer1">QQ.SG has no connection with Tencent Group, QQ.COM, or Tencent Holdings.</div>
      </footer>
    </section>

    <section class="right" aria-hidden="true">
      <div class="dial-wrap">
        <div class="dial" id="dial">
          <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" />
              </filter>
            </defs>
            <g id="dial-bg"></g>
            <g id="ticks-major"></g>
            <g id="ticks-minor"></g>
            <g id="markers"></g>
            <g id="numbers"></g>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Copied</div>

  <script>
    const config = {
      name: 'NKX',
      initials: 'NK',
      avatarUrl: '',
      tagline: 'This is the channel of MarkNKX.',
      primaryLabel: 'Primary Email',
      email: 'ME@qq.sg',
      meta: ['UTC+8', 'Open for selected work'],
      github: { label: 'Code', value: 'GitHub', href: 'https://github.com/yourname' },
      blog: { label: 'Blog', value: '碑.NET', href: 'https://yourblog.example.com' },
      copyright: '© 2026 NKX · QQ.SG',
      footer1: 'QQ.SG has no connection with Tencent Group, QQ.COM, or Tencent Holdings.',
      timezone: 'UTC+8',
      timeZoneIANA: 'Asia/Singapore'
    };

    const $ = (id) => document.getElementById(id);

    function initContent() {
      const avatar = $('avatar');
      if (config.avatarUrl) {
        const img = document.createElement('img');
        img.src = config.avatarUrl;
        img.alt = config.name;
        avatar.appendChild(img);
      } else {
        const span = document.createElement('span');
        span.textContent = config.initials;
        avatar.appendChild(span);
      }

      $('name').textContent = config.name;
      $('tagline').textContent = config.tagline;
      $('primaryLabel').textContent = config.primaryLabel;
      $('primaryValue').textContent = config.email;
      $('githubLabel').textContent = config.github.label;
      $('githubValue').textContent = config.github.value;
      $('githubCard').href = config.github.href;
      $('blogLabel').textContent = config.blog.label;
      $('blogValue').textContent = config.blog.value;
      $('blogCard').href = config.blog.href;
      $('copyright').textContent = config.copyright;
      $('footer1').textContent = config.footer1;
      document.title = `${config.name} — Refined Console`;

      const meta = $('meta');
      meta.innerHTML = '';
      config.meta.forEach(item => {
        const span = document.createElement('span');
        span.textContent = item;
        meta.appendChild(span);
      });
    }

    function polar(cx, cy, r, deg) {
      const rad = (deg - 90) * Math.PI / 180;
      return { x: cx + Math.cos(rad) * r, y: cy + Math.sin(rad) * r };
    }

    function drawLine(group, x1, y1, x2, y2, attrs = {}) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      Object.entries(attrs).forEach(([k, v]) => line.setAttribute(k, v));
      group.appendChild(line);
      return line;
    }

    function drawText(group, x, y, text, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      el.setAttribute('x', x);
      el.setAttribute('y', y);
      el.textContent = text;
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      group.appendChild(el);
      return el;
    }

    function drawCircle(group, cx, cy, r, attrs = {}) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx);
      c.setAttribute('cy', cy);
      c.setAttribute('r', r);
      Object.entries(attrs).forEach(([k, v]) => c.setAttribute(k, v));
      group.appendChild(c);
      return c;
    }

    function buildDial() {
      const major = $('ticks-major');
      const minor = $('ticks-minor');
      const bg = $('dial-bg');
      const numbers = $('numbers');
      const markers = $('markers');
      [major, minor, bg, numbers, markers].forEach(group => group.innerHTML = '');

      const cx = 740;
      const cy = 560;

      drawCircle(bg, cx, cy, 525, { fill: 'none', stroke: 'rgba(20,20,20,.055)', 'stroke-width': '1.6' });
      drawCircle(bg, cx, cy, 410, { fill: 'none', stroke: 'rgba(20,20,20,.046)', 'stroke-width': '1.4' });
      drawCircle(bg, cx, cy, 305, { fill: 'none', stroke: 'rgba(20,20,20,.05)', 'stroke-width': '1.3' });
      drawCircle(bg, cx, cy, 195, { fill: 'none', stroke: 'rgba(20,20,20,.04)', 'stroke-width': '1.2' });
      drawCircle(bg, cx, cy, 16, { fill: 'none', stroke: 'rgba(20,20,20,.05)', 'stroke-width': '1.2' });

      for (let i = 0; i < 36; i++) {
        const angle = 200 + i * 4.9;
        const isStrong = i % 3 === 0;
        const a = polar(cx, cy, 472, angle);
        const b = polar(cx, cy, isStrong ? 442 : 452, angle);
        drawLine(major, a.x, a.y, b.x, b.y, {
          stroke: isStrong ? 'rgba(20,20,20,.14)' : 'rgba(20,20,20,.08)',
          'stroke-width': isStrong ? '3.2' : '2.2',
          'stroke-linecap': 'round'
        });
      }

      for (let i = 0; i < 44; i++) {
        const angle = 212 + i * 3.4;
        const a = polar(cx, cy, 355, angle);
        const b = polar(cx, cy, 340, angle);
        drawLine(minor, a.x, a.y, b.x, b.y, {
          stroke: 'rgba(20,20,20,.07)',
          'stroke-width': '2',
          'stroke-linecap': 'round'
        });
      }

      const diagA = { x: 320, y: 146 };
      const diagB = { x: 975, y: 804 };
      drawLine(markers, diagA.x, diagA.y, diagB.x, diagB.y, {
        stroke: 'rgba(20,20,20,.17)',
        'stroke-width': '1.5'
      });

      drawText(markers, 388, 193, config.timezone, {
        fill: 'rgba(20,20,20,.42)',
        'font-size': '15',
        'font-weight': '700',
        'letter-spacing': '0.16em',
        transform: 'rotate(33 388 193)'
      });

      drawText(numbers, 848, 350, '20', {
        fill: 'rgba(20,20,20,.18)',
        'font-size': '58',
        'font-weight': '700',
        'letter-spacing': '-0.08em'
      });
      drawText(numbers, 598, 420, '15', {
        fill: 'rgba(20,20,20,.2)',
        'font-size': '50',
        'font-weight': '700',
        'letter-spacing': '-0.06em',
        transform: 'rotate(-28 590 430)'
      });
      drawText(numbers, 498, 628, '10', {
        fill: 'rgba(20,20,20,.15)',
        'font-size': '44',
        'font-weight': '700',
        'letter-spacing': '-0.06em',
        transform: 'rotate(-66 500 608)'
      });
      drawText(numbers, 475, 782, '5', {
        fill: 'rgba(20,20,20,.16)',
        'font-size': '44',
        'font-weight': '700',
        'letter-spacing': '-0.06em'
      });

      drawText(numbers, 684, 520, '7', {
        fill: 'rgba(20,20,20,.46)',
        'font-size': '70',
        'font-weight': '700',
        'letter-spacing': '-0.09em',
        transform: 'rotate(-18 684 522)'
      });
      drawText(numbers, 562, 642, '6', {
        fill: 'rgba(20,20,20,.48)',
        'font-size': '68',
        'font-weight': '700',
        'letter-spacing': '-0.09em',
        transform: 'rotate(-34 552 636)'
      });
      drawText(numbers, 475, 784, '5', {
        fill: 'rgba(20,20,20,.48)',
        'font-size': '66',
        'font-weight': '700',
        'letter-spacing': '-0.09em',
        transform: 'rotate(8 468 770)'
      });
      drawText(numbers, 905, 568, '8', {
        fill: 'rgba(20,20,20,.46)',
        'font-size': '88',
        'font-weight': '700',
        'letter-spacing': '-0.09em',
        transform: 'rotate(22 900 570)'
      });

      drawLine(markers, 778, 151, 790, 190, { stroke: 'rgba(20,20,20,.14)', 'stroke-width': '6', 'stroke-linecap': 'round' });
      drawLine(markers, 830, 126, 840, 162, { stroke: 'rgba(20,20,20,.09)', 'stroke-width': '3', 'stroke-linecap': 'round' });
      drawCircle(markers, 808, 296, 14, { fill: 'rgba(20,20,20,.055)' });
      drawCircle(markers, 808, 296, 4.4, { fill: 'rgba(20,20,20,.2)' });
    }

    async function copyEmail() {
      const text = config.email;
      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      showToast('邮箱已复制');
    }

    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1300);
    }

    function bindMotion() {
      const dial = $('dial');
      let rafId = null;
      window.addEventListener('pointermove', (event) => {
        const x = event.clientX / window.innerWidth - .5;
        const y = event.clientY / window.innerHeight - .5;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          dial.style.transform = `translateY(calc(-50% + ${y * 10}px)) translateX(${x * 10}px)`;
        });
      }, { passive: true });
      window.addEventListener('pointerleave', () => {
        dial.style.transform = 'translateY(-50%)';
      });
    }

    function init() {
      initContent();
      buildDial();
      bindMotion();
      $('copyBtn').addEventListener('click', copyEmail);
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NKX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 极简配色：只有黑、白、灰 */
            --bg: #FAFAFA; /* 极浅的灰白底，比纯白护眼 */
            --card-bg: #FFFFFF;
            --text-main: #111111;
            --text-sub: #666666;
            --border: #E5E5E5; /* 极细的边框 */
            --accent: #000000; /* 强调色就是纯黑 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 380px; /* 限制最大宽度，防止布局散架 */
            padding: 24px;
            box-sizing: border-box; /* 防止边距撑破布局 */
        }

        /* 1. 顶部身份区：极简排列 */
        .header {
            margin-bottom: 40px;
            /* 修正布局：让头像和文字自然左对齐，不搞复杂的居中 */
            display: flex;
            flex-direction: column; 
            gap: 16px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 8px; /* 稍微圆角，不要正圆，更有建筑感 */
            background-image: url('https://github.com/3257085208.png');
            background-size: cover;
            background-color: #eee;
            border: 1px solid var(--border);
        }

        .identity h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }

        .identity p {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
            line-height: 1.5;
        }

        /* 2. 功能区：卡片式列表，干干净净 */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.15s ease-out; /* 快速响应，不要慢吞吞的过渡 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* 悬停效果：只有边框变黑，极其克制 */
        .card:active, .card:hover {
            border-color: #000;
            transform: translateY(-1px);
        }

        /* 重点卡片：邮箱 */
        .card.featured {
            padding: 24px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
            font-family: 'Inter', monospace; /* 数字/邮箱用等宽字体 */
        }

        .arrow {
            color: #ccc;
            font-size: 18px;
            transition: color 0.2s;
        }
        
        .card:hover .arrow {
            color: #000;
        }

        /* 复制成功的提示：极简的小黑条 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #000;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 底部声明：不像AI生成的那么显眼，融入背景 */
        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer span {
            opacity: 0.6;
        }

        /* 移动端适配修正 */
        @media (max-width: 480px) {
            .container { padding: 20px; }
            .header { gap: 12px; margin-bottom: 30px; }
            .avatar { width: 56px; height: 56px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="avatar"></div>
            <div class="identity">
                <h1>NKX</h1>
                <p>Digital Playground<br>based in Singapore.</p>
            </div>
        </div>

        <div class="grid">
            
            <div class="card featured" onclick="copyEmail()">
                <div class="card-content">
                    <span class="label">Primary Email</span>
                    <span class="value">ME@QQ.SG</span>
                </div>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </div>

            <a href="https://github.com/3257085208" target="_blank" class="card">
                <div class="card-content">
                    <span class="label">Code</span>
                    <span class="value">GitHub Profile</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <div class="card" style="opacity: 0.5; cursor: default;">
                <div class="card-content">
                    <span class="label">Project</span>
                    <span class="value">Website Coming Soon</span>
                </div>
            </div>

        </div>

        <footer>
            <span>© 2026 NKX</span>
            <span>QQ.SG</span>
        </footer>

    </div>

    <div class="toast" id="toast">Email Copied</div>

    <script>
        function copyEmail() {
            navigator.clipboard.writeText("ME@QQ.SG").then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }
    </script>
</body>
</html>

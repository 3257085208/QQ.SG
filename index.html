<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ.SG</title>
    <style>
        body {
            background-color: #f4f4f4;
            color: #1a1a1a;
            /* 使用衬线字体，看起来更有文化、更贵 */
            font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #fff;
            padding: 80px 100px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 6rem;
            font-weight: 400; /* 细字体显贵 */
            margin: 0;
            line-height: 1;
            letter-spacing: -2px;
        }
        p.desc {
            font-family: Helvetica, Arial, sans-serif; /* 副标题用无衬线体对比 */
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #999;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .line {
            width: 50px;
            height: 1px;
            background-color: #000;
            margin: 30px auto;
        }
        a.email {
            font-family: Helvetica, Arial, sans-serif;
            text-decoration: none;
            color: #000;
            font-size: 0.9rem;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.3s;
        }
        a.email:hover {
            border-bottom: 1px solid #000;
        }
        footer {
            position: absolute;
            bottom: 30px;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>QQ.SG</h1>
        <div class="line"></div>
        <p class="desc">Quality &middot; Quest &middot; Singapore</p>
        
        <br><br>
        <a href="mailto:contact@qq.sg" class="email">Inquiries</a>
    </div>

    <footer>
        Personal Portfolio. Not affiliated with any IM service.
    </footer>

</body>
</html>

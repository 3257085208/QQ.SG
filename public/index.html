<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QQ.SG 星图导航</title>
  <meta name="description" content="DaFuHao / QQ.SG Group 的星图导航台">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="/links.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="page-frame">
    <header class="topbar">
      <a class="brand" href="https://github.com/3257085208" target="_blank" rel="noreferrer">
        <span class="brand-glyph" aria-hidden="true">Q</span>
        <span>
          <strong>QQ.SG</strong>
          <small>NAVIGATION DECK</small>
        </span>
      </a>
      <div class="telemetry">
        <span class="tick"><i data-lucide="radio" data-glyph="R"></i><b id="repoCount">36</b> REPOS</span>
        <span class="tick"><i data-lucide="users" data-glyph="U"></i><b id="followersCount">04</b> FOLLOWERS</span>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </header>

    <main class="atlas">
      <section class="console-panel" aria-label="导航中心">
        <div class="dial">
          <div class="dial-rings" aria-hidden="true">
            <span class="ring ring-a"></span>
            <span class="ring ring-b"></span>
            <span class="ring ring-c"></span>
          </div>
          <a class="core" href="https://github.com/3257085208" target="_blank" rel="noreferrer">
            <img class="avatar" src="/assets/avatar.png" alt="DaFuHao">
            <span class="core-copy">
              <strong>DaFuHao</strong>
              <small>QQ.SG / CHAIRMAN</small>
            </span>
          </a>
          <a class="waypoint waypoint--n" style="--wp:#0e7c86" href="https://status.qq.sg" target="_blank" rel="noreferrer">
            <i data-lucide="activity" data-glyph="S"></i>STATUS
          </a>
          <a class="waypoint waypoint--e" style="--wp:#c62f3e" href="https://www.niekaixiang.com" target="_blank" rel="noreferrer">
            <i data-lucide="book-open" data-glyph="B"></i>BLOG
          </a>
          <a class="waypoint waypoint--s" style="--wp:#5f4b8b" href="https://github.com/3257085208" target="_blank" rel="noreferrer">
            <i data-lucide="github" data-glyph="G"></i>GITHUB
          </a>
          <a class="waypoint waypoint--w" style="--wp:#d88a24" href="https://sink.cool" target="_blank" rel="noreferrer">
            <i data-lucide="link-2" data-glyph="L"></i>SINK
          </a>
        </div>
        <div class="console-meta">
          <div>
            <span class="meta-label">NAV SIGNAL</span>
            <strong>ALL NODES ONLINE</strong>
          </div>
          <div>
            <span class="meta-label">UTC</span>
            <strong id="utcClock">--:--:--</strong>
          </div>
        </div>
      </section>

      <section class="directory-panel" aria-label="项目导航">
        <div class="panel-head">
          <div>
            <span class="eyebrow">SIGNAL CATALOG</span>
            <h1>导航星图</h1>
          </div>
          <span class="scan-count"><b id="visibleCount">0</b> / <span id="totalCount">0</span></span>
        </div>
        <div class="search-bar">
          <i data-lucide="scan-search" data-glyph="S"></i>
          <input id="searchInput" type="search" placeholder="搜索站点、项目、标签" autocomplete="off">
          <button id="clearButton" class="icon-button" aria-label="清空搜索" hidden><i data-lucide="x" data-glyph="X"></i></button>
        </div>
        <div class="filters" id="filters" role="tablist" aria-label="分类筛选"></div>
        <div class="card-grid" id="cardGrid"></div>
      </section>
    </main>

    <footer class="footbar">
      <span>QQ.SG / OPEN-SOURCE ORBITAL INDEX</span>
      <a href="https://status.qq.sg" target="_blank" rel="noreferrer">SERVER STATUS <i data-lucide="arrow-up-right" data-glyph="->"></i></a>
    </footer>
  </div>
</body>
</html>
